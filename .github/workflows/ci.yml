name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop/requirements-dev.txt
      - name: Install desktop dependencies
        working-directory: desktop
        run: python -m pip install -r requirements-dev.txt
      - name: Test desktop
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  linux-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop/requirements-dev.txt
      - name: Install Linux desktop runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 scrot
      - name: Build and test Linux desktop
        run: bash scripts/build-linux.sh
      - name: Packaged self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: desktop/dist/ScreenAssistant --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenAssistant-Linux-x86_64
          path: |
            release/linux/ScreenAssistant-Linux-x86_64.tar.gz
            release/linux/ScreenAssistant-Linux-x86_64.tar.gz.sha256

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
